version: "3.9"

services:
  ruoyi-admin:
    image: webconfig:1.0
    container_name: ruoyi-admin
    restart: unless-stopped
    ports:
      - "7080:8080"
      - "28080:28080"

    environment:
      SERVER_PORT: 8080
      SNAIL_PORT: 28080
      JAVA_OPTS: >
        -Xms512m
        -Xmx1024m
        -Dspring.profiles.active=prod
        -Dspring.config.additional-location=file:/ruoyi/server/config/

    volumes:
      - ./config:/ruoyi/server/config
      - ./logs:/ruoyi/server/logs
      - ./temp:/ruoyi/server/temp

    networks:
      - ruoyi

networks:
  ruoyi:
    driver: bridge
