services:
  ping-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: ping-agent
    restart: unless-stopped
    cap_add:
      - NET_RAW
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    environment:
      PING_AGENT_ENABLED: "true"
      PING_AGENT_MASTER_URL: ${PING_AGENT_MASTER_URL:?set PING_AGENT_MASTER_URL}
      PING_AGENT_UUID_FILE: /etc/ping-agent/uuid
      PING_AGENT_RETRY_INTERVAL: ${PING_AGENT_RETRY_INTERVAL:-30s}
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
      - ${PING_AGENT_HOST_UUID_FILE:-./ping-agent.uuid}:/etc/ping-agent/uuid:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
